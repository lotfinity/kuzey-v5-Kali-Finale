            { key: 'parks', label: 'Parks' },
            { key: 'schools', label: 'Schools' }
        ];

            const legendGrid = document.getElementById('legendGrid');

                const entries = amenities[item.key];
                if (!entries || entries.length === 0) return;
                const color = colors[item.key] || '#95a5a6';
                const builder = legendBuilders[item.key];
                const iconHtml = builder ? builder(color) : `<div class="legend-chip" style="background:${color};">${icons[item.key] || '•'}</div>`;

                    });

        }

        legendToggle.addEventListener('click', () => {

        // Fullscreen toggle

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {

            } else {

                fsIcon.className = 'fas fa-expand';
            }
        }
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', () => {

        });
        document.addEventListener('webkitfullscreenchange', () => {

        });
