            attribution: '© OpenStreetMap contributors, © CARTO',
            maxZoom: 19
        }).addTo(map);

        // Add center marker with Font Awesome icon
        const centerIcon = L.divIcon({
            html: '<div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;"><i class="fas fa-map-marker-alt" style="font-size: 40px; color: #e23116ff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));"></i></div>',
            className: '',
            iconSize: [40, 40],
            iconAnchor: [20, 40],
            popupAnchor: [0, -40]
        });

        L.marker([centerLat, centerLng], { icon: centerIcon })
            .addTo(map)
            .bindPopup('<div class="popup-title">📍 Your Location</div><div class="popup-info">41.027153,28.669443</div>');

        // Add radius circle
        L.circle([centerLat, centerLng], {
            radius: radiusM,
            color: '#a38344',
            fillColor: '#a38344',
            fillOpacity: 0.08,
            weight: 2
        }).addTo(map);

        // Color mapping for different amenity types
        const colors = {
            metro: '#e74c3c',
            metrobus: '#e67e22',
            bus: '#3498db',
            taxi: '#f39c12',
            minibus: '#1abc9c',
            grocery: '#27ae60',
            clothing: '#9b59b6',
            malls: '#e91e63',
            parks: '#16a085',
            schools: '#34495e'
        };

        // Helper to create legend icon markup consistent with markers
        const legendBuilders = {
            metro: () => '<img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Istanbul_Metro_Logo.svg" alt="Metro" style="width: 22px; height: 22px;">',
            metrobus: () => '<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Metrobus_%C4%B0stanbul_Logo.svg/250px-Metrobus_%C4%B0stanbul_Logo.svg.png" alt="Metrobus" style="width: 22px; height: 22px;">',
            bus: (color) => `<div class="legend-chip" style="background:${color};"><i class="fas fa-bus" style="color:white; font-size: 12px;"></i></div>`,
            taxi: (color) => `<div class="legend-chip" style="background:${color};"><i class="fas fa-taxi" style="color:white; font-size: 12px;"></i></div>`,
            minibus: (color) => `<div class="legend-line" style="background:${color};"></div>`,
            grocery: (color) => `<div class="legend-chip" style="background:${color};"><i class="fas fa-shopping-cart" style="color:white; font-size: 12px;"></i></div>`,
            clothing: (color) => `<div class="legend-chip" style="background:${color};"><i class="fas fa-shopping-cart" style="color:white; font-size: 12px;"></i></div>`,
            malls: (color) => `<div class="legend-chip" style="background:${color};"><span style="font-size:12px;">🏬</span></div>`,
            parks: (color) => `<div class="legend-chip" style="background:${color};"><span style="font-size:12px;">🌳</span></div>`,
            schools: (color) => `<div class="legend-chip" style="background:${color};"><span style="font-size:12px;">🏫</span></div>`
        };

        // Legend definitions (label order)
        const legendItems = [
            { key: 'metro', label: 'Metro Stations' },
            { key: 'metrobus', label: 'Metrobus Stations' },
            { key: 'bus', label: 'Bus Stops' },
            { key: 'taxi', label: 'Taxi Stands' },
            { key: 'minibus', label: 'Minibus Lines' },
            { key: 'grocery', label: 'Grocery Stores' },
            { key: 'clothing', label: 'Clothing Stores' },
            { key: 'malls', label: 'Shopping Malls' },
            { key: 'parks', label: 'Parks' },
            { key: 'schools', label: 'Schools' }
        ];

        function renderLegend() {
            const legendGrid = document.getElementById('legendGrid');
            legendGrid.innerHTML = '';
            legendItems.forEach(item => {
                const entries = amenities[item.key];
                if (!entries || entries.length === 0) return;
                const color = colors[item.key] || '#95a5a6';
                const builder = legendBuilders[item.key];
                const iconHtml = builder ? builder(color) : `<div class="legend-chip" style="background:${color};">${icons[item.key] || '•'}</div>`;
                legendGrid.insertAdjacentHTML('beforeend', `
                    <div class="legend-item">
                        ${iconHtml}
                        <span>${item.label}</span>
                    </div>
                `);
            });
        }

        // Create metro station icon using Istanbul Metro logo
        function createMetroIcon() {
            return L.icon({
                iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/4/4f/Istanbul_Metro_Logo.svg',
                iconSize: [24, 24],
                iconAnchor: [12, 12],
                popupAnchor: [0, -12],
                className: 'metro-icon',
                crossOrigin: 'anonymous'
            });
        }

        // Create metrobus station icon using Istanbul Metrobus logo
        function createMetrobusIcon() {
            return L.icon({
                iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Metrobus_%C4%B0stanbul_Logo.svg/250px-Metrobus_%C4%B0stanbul_Logo.svg.png',
                iconSize: [24, 24],
                iconAnchor: [12, 12],
                popupAnchor: [0, -12],
                className: 'metrobus-icon',
                crossOrigin: 'anonymous'
            });
        }

        // Icon mapping for different amenity types
        const icons = {
            metro: '🚇',
            metrobus: '🚌',
            bus: '🚏',
            taxi: '🚕',
            minibus: '🚐',
            grocery: '🛒',
            clothing: '👕',
            malls: '🏬',
            parks: '🌳',
            schools: '🏫'
        };

        // Add amenities to map
        Object.keys(amenities).forEach(type => {
            const items = amenities[type];
            const color = colors[type] || '#95a5a6';
            const icon = icons[type] || '📍';

            items.forEach(item => {
                let marker;
                const distanceKm = (item.distance_m / 1000).toFixed(2);
                const distanceM = Math.round(item.distance_m);
                const distanceText = distanceM < 1000 ? `${distanceM}m` : `${distanceKm}km`;

                // Use special icons for different amenity types
                if (type === 'metro') {
                    marker = L.marker([item.lat, item.lng], { icon: createMetroIcon() });
                } else if (type === 'metrobus') {
                    marker = L.marker([item.lat, item.lng], { icon: createMetrobusIcon() });
                } else if (type === 'bus') {
                    const markerIcon = L.divIcon({
                        html: `<div style="background-color: ${color}; width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;"><i class="fas fa-bus" style="color: white; font-size: 14px;"></i></div>`,
                        className: '',
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });
                    marker = L.marker([item.lat, item.lng], { icon: markerIcon });
                } else if (type === 'minibus') {
                    // Minibus lines are LineStrings, render them as paths (not point markers)
                    if (item.geometry) {
                        const lineStyle = {
                            color: color,
                            weight: 8,
                            opacity: 0.9,
                            dashArray: '10, 5'
                        };
                        const line = L.geoJSON(item.geometry, {
                            style: lineStyle,
                            onEachFeature: function(feature, layer) {
                                layer.bindPopup(`
                                    <div class="popup-title">${icon} ${item.name}</div>
                                    <div class="popup-info">Type: <strong>Minibus Line</strong></div>
                                    <div class="popup-info">Route ID: ${item.id || 'N/A'}</div>
                                `);
                            }
                        });
                        line.addTo(map);
                    }
                    return; // Skip the regular marker creation below
                } else if (type === 'taxi') {
                    const markerIcon = L.divIcon({
                        html: `<div style="background-color: ${color}; width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;"><i class="fas fa-taxi" style="color: white; font-size: 14px;"></i></div>`,
                        className: '',
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });
                    marker = L.marker([item.lat, item.lng], { icon: markerIcon });
                } else if (type === 'grocery' || type === 'clothing') {
                    const markerIcon = L.divIcon({
                        html: `<div style="background-color: ${color}; width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;"><i class="fas fa-shopping-cart" style="color: white; font-size: 14px;"></i></div>`,
                        className: '',
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });
                    marker = L.marker([item.lat, item.lng], { icon: markerIcon });
                } else {
                    const markerIcon = L.divIcon({
                        html: `<div style="background-color: ${color}; width: 24px; height: 24px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 12px;">${icon}</div>`,
                        className: '',
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });
                    marker = L.marker([item.lat, item.lng], { icon: markerIcon });
                }

                marker.addTo(map)
                    .bindPopup(`
                        <div class="popup-title">${icon} ${item.name}</div>
                        <div class="popup-info">Type: <strong>${type.charAt(0).toUpperCase() + type.slice(1)}</strong></div>
                        <div class="popup-info">Distance: <span class="popup-distance">${distanceText}</span></div>
                    `);
            });
        });

        // Build legend after markers to reflect available types
        renderLegend();

        // Fit bounds to show all markers
        setTimeout(() => {
            map.fitBounds([
                [centerLat - (radiusM / 111320), centerLng - (radiusM / (111320 * Math.cos(centerLat * Math.PI / 180)))],
                [centerLat + (radiusM / 111320), centerLng + (radiusM / (111320 * Math.cos(centerLat * Math.PI / 180)))]
            ], { padding: [50, 50] });
        }, 100);

        // Legend toggle
        const legend = document.getElementById('legend');
        const legendToggle = document.getElementById('legendToggle');

        // Collapse legend by default on small screens
        if (window.matchMedia('(max-width: 768px)').matches) {
            legend.classList.add('collapsed');
            legendToggle.textContent = 'Show';
        }

        legendToggle.addEventListener('click', () => {
            legend.classList.toggle('collapsed');
            legendToggle.textContent = legend.classList.contains('collapsed') ? 'Show' : 'Hide';
        });

        // Fullscreen toggle
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fsIcon = fullscreenBtn.querySelector('i');
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const el = document.documentElement;
                (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
                fsIcon.className = 'fas fa-compress';
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                fsIcon.className = 'fas fa-expand';
            }
        }
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', () => {
            fsIcon.className = document.fullscreenElement ? 'fas fa-compress' : 'fas fa-expand';
        });
        document.addEventListener('webkitfullscreenchange', () => {
            fsIcon.className = document.webkitFullscreenElement ? 'fas fa-compress' : 'fas fa-expand';
        });
    </script>
